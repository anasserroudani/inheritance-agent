<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a0505">
  <title>المساعد الشرعي للمواريث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load in the background, the page works without them -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Aref+Ruqaa:wght@400;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6 21h12M5 7h14M5 7l-3 7a4 4 0 0 0 6 0L5 7Zm14 0-3 7a4 4 0 0 0 6 0l-3-7Z"/></svg>
        </span>
        <div>
          <h1>المساعد الشرعي للمواريث</h1>
          <p>مدونة الأسرة المغربية · المذهب المالكي</p>
        </div>
      </div>
      <button id="reset" class="newbtn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>محادثة جديدة</span>
      </button>
    </div>
  </header>

  <div id="demo-banner" class="banner" hidden>وضع تجريبي: الأجوبة ثابتة ولا يوجد ذكاء اصطناعي حقيقي</div>

  <main id="chat" class="chat" aria-live="polite"></main>

  <section class="composer">
    <form id="form" class="row">
      <textarea id="input" rows="1" dir="auto" placeholder="اكتب سؤالك أو مسألتك هنا…" aria-label="سؤالك"></textarea>
      <button id="send" type="submit" aria-label="إرسال">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
    <p class="note">هذا المساعد يقدّم معلومات للتوعية ولا يغني عن الفتوى أو عن العدول والموثقين. لا تُدخل أسماء أو أرقام هوية أو معطيات شخصية.</p>
  </section>

  <script
  src="https://cloud.livekit.io/embed-popup.js"
  data-lk-agent="CA_XibLZ9MvBVy4"
  data-lk-color="#002CF2"
></script>
  <script src="app.js" defer></script>
</body>
</html>
